const db = firebase.firestore();
const auth = firebase.auth();
const provider = new firebase.auth.GoogleAuthProvider();
auth.setPersistence(firebase.auth.Auth.Persistence.NONE);

async function connexionGoogle() {
  try {
    document.getElementById("login-err").textContent = "";
    const result = await auth.signInWithPopup(provider);
    if (result.user.email === "zemag36@gmail.com") {
      deverrouiller();
    } else {
      document.getElementById("login-err").textContent = "Ce compte n'est pas autorisé.";
      await auth.signOut();
    }
  } catch (e) {
    if (e.code !== "auth/popup-closed-by-user") {
      document.getElementById("login-err").textContent = "Erreur de connexion. Réessayez.";
    }
  }
}

function deverrouiller() {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("root").style.display = "block";
  if (window.lancerApp) window.lancerApp();
}

  const moisAnnee = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet/Août", "Septembre", "Octobre", "Novembre", "Décembre"];

      numero++;

  }
  return liste;
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function euros(n) { return new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(n || 0); }
function editionLabel(e) { return e ? `${e.numero} - ${e.mois} ${e.annee}` : "Édition non précisée"; }
function editionKey(e) { return `${e.mois}|${e.annee}`; }

function chargerLocal(cle, defaut) {
  try {
    const brut = localStorage.getItem(cle);
    return brut ? JSON.parse(brut) : defaut;
  } catch (e) { return defaut; }
}
function sauverLocal(cle, valeur) {
  try { localStorage.setItem(cle, JSON.stringify(valeur)); } catch (e) {}
}

const emptyForm = {
  client: "", surface: SURFACES_DEFAUT[0], position: POSITIONS_DEFAUT[0], montantHT: "",
  texteRecu: false, paye: false, editionIdx: 0,
  programmerPlusieurs: false, editionDepartIdx: 0, nbParutions: "",
  dateEnvoiQuestionnaire: "", retourClient: "", dateEnvoiMaquette: "",
  statutBAT: "", dateStatutBAT: "", statutPublireportage: "", notes: "",
};

const inputStyle = { width: "100%", padding: "8px 10px", border: "1px solid #d9d0bc", borderRadius: 8, fontSize: 14, background: "#fdfbf6" };

function Champ({ label, required, children }) {
  return (
    <label style={{ display: "block", fontSize: 12, color: "#5c5548", marginBottom: 2, marginTop: 8 }}>
      {label}{required && <span style={{ color: "#a8412f" }}> *</span>}
      <div style={{ marginTop: 4 }}>{children}</div>
    </label>
  );
}

function Kpi({ label, value, accent }) {
  return (
    <div style={{ background: "#fff", border: "1px solid #e2dac7", borderRadius: 10, padding: 14 }}>
      <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.06em", color: "#8b8478" }}>{label}</div>
      <div style={{ fontSize: 22, fontWeight: 700, marginTop: 4, color: accent || "#2c2a24" }}>{value}</div>
    </div>
  );
}

function App() {
  const [ventes, setVentes] = useState(() => chargerLocal("zemag-pub-ventes", []));
  const [editions] = useState(EDITIONS_DEFAUT);
  const [bilanExtra, setBilanExtra] = useState(() => chargerLocal("zemag-pub-bilan", {}));
  const [surfaces, setSurfaces] = useState(() => chargerLocal("zemag-pub-surfaces", SURFACES_DEFAUT));
  const [positions, setPositions] = useState(() => chargerLocal("zemag-pub-positions", POSITIONS_DEFAUT));
  const [onglet, setOnglet] = useState("saisie");
  const [form, setForm] = useState(emptyForm);
  const [editId, setEditId] = useState(null);
  const [filtreEdition, setFiltreEdition] = useState("tous");
  const [filtreAnnee, setFiltreAnnee] = useState(new Date().getFullYear());
  const [nouveauSurface, setNouveauSurface] = useState("");
  const [nouveauPosition, setNouveauPosition] = useState("");
  const [erreur, setErreur] = useState("");
  const [recherche, setRecherche] = useState("");
  const [filtreBAT, setFiltreBAT] = useState("tous");
  const [bonForm, setBonForm] = useState(() => chargerLocal("zemag-pub-bon", {
    date: "", raisonSociale: "", adresse: "", codePostal: "", ville: "",
    email: "", tel: "", mobile: "",
    lignes: Array.from({ length: 5 }, () => ({ rubrique: "", format: "", tarif: "", nbParutions: "", tarifRemise: "" })),
    calendrier: Array.from({ length: 5 }, () => Array(11).fill(false)),
    modePaiement: "", observations: "", nomQualite: "",
    anneeBon: new Date().getFullYear(),
  }));

  const docRef = db.collection("zemag").doc("data");

  function majVentes(fn) { setVentes((vs) => { const nv = fn(vs); sauverLocal("zemag-pub-ventes", nv); docRef.set({ ventes: nv }, { merge: true }).catch(() => {}); return nv; }); }
  function majBilanExtra(fn) { setBilanExtra((b) => { const nb = fn(b); sauverLocal("zemag-pub-bilan", nb); docRef.set({ bilanExtra: nb }, { merge: true }).catch(() => {}); return nb; }); }
  function majSurfaces(fn) { setSurfaces((s) => { const ns = fn(s); sauverLocal("zemag-pub-surfaces", ns); docRef.set({ surfaces: ns }, { merge: true }).catch(() => {}); return ns; }); }
  function majPositions(fn) { setPositions((p) => { const np = fn(p); sauverLocal("zemag-pub-positions", np); docRef.set({ positions: np }, { merge: true }).catch(() => {}); return np; }); }

  useEffect(() => {
    docRef.get().then((doc) => {
      if (!doc.exists) {
        docRef.set({ ventes, bilanExtra, surfaces, positions, bonCommande: bonForm }).catch(() => {});
      }
    }).catch(() => {});

    const unsub = docRef.onSnapshot((doc) => {
      if (!doc.exists || doc.metadata.hasPendingWrites) return;
      const d = doc.data();
      if (d.ventes !== undefined) { setVentes(d.ventes); sauverLocal("zemag-pub-ventes", d.ventes); }
      if (d.bilanExtra !== undefined) { setBilanExtra(d.bilanExtra); sauverLocal("zemag-pub-bilan", d.bilanExtra); }
      if (d.surfaces !== undefined) { setSurfaces(d.surfaces); sauverLocal("zemag-pub-surfaces", d.surfaces); }
      if (d.positions !== undefined) { setPositions(d.positions); sauverLocal("zemag-pub-positions", d.positions); }
      if (d.bonCommande !== undefined && !bonEditingRef.current) { setBonForm(d.bonCommande); sauverLocal("zemag-pub-bon", d.bonCommande); }
    });
    return () => unsub();
  }, []);

  const parEdition = useMemo(() => {
    const map = {};
    for (const v of ventes) {
      const k = editionKey(v.edition);
      if (!map[k]) map[k] = [];
      map[k].push(v);
    }
    return map;
  }, [ventes]);

  const moisLabelCourant = MOIS_LABELS[new Date().getMonth()];
  const anneeCourante = new Date().getFullYear();
  const editionCourante = editions.find((e) => e.mois === moisLabelCourant && e.annee === anneeCourante) || editions[0];
  const venteMoisCourant = parEdition[editionKey(editionCourante)] || [];

  const anneesDisponibles = useMemo(() => [...new Set(editions.map((e) => e.annee))], [editions]);
  const ventesAnnee = useMemo(() => ventes.filter((v) => v.edition && v.edition.annee === filtreAnnee), [ventes, filtreAnnee]);

  const editionsSelectionnees = useMemo(() => {
    if (!form.programmerPlusieurs) return [];
    const n = parseInt(form.nbParutions, 10);
    if (!n || n < 1) return [];
    return editions.slice(form.editionDepartIdx, form.editionDepartIdx + n);
  }, [form.programmerPlusieurs, form.editionDepartIdx, form.nbParutions, editions]);

  const venteAffichees = useMemo(() => {
    let liste = filtreEdition === "tous" ? ventes : (parEdition[filtreEdition] || []);
    if (recherche.trim()) {
      const q = recherche.trim().toLowerCase();
      liste = liste.filter((v) => v.client.toLowerCase().includes(q));
    }
    if (filtreBAT === "non_envoye") liste = liste.filter((v) => !v.statutBAT);
    else if (filtreBAT !== "tous") liste = liste.filter((v) => v.statutBAT === filtreBAT);
    return [...liste].sort((a, b) => {
      const ia = editions.findIndex((e) => editionKey(e) === editionKey(a.edition));
      const ib = editions.findIndex((e) => editionKey(e) === editionKey(b.edition));
      if (ia !== ib) return ib - ia;
      return a.client.localeCompare(b.client);
    });
  }, [ventes, parEdition, filtreEdition, recherche, filtreBAT, editions]);

  const caFiltre = useMemo(() => venteAffichees.reduce((s, v) => s + (parseFloat(v.montantHT) || 0), 0), [venteAffichees]);

  const kpiVentes = onglet === "suivi" ? venteAffichees : venteMoisCourant;
  const kpiLabelEdition = onglet === "suivi"
    ? (filtreEdition === "tous" ? "toutes éditions" : editionLabel(editions.find((e) => editionKey(e) === filtreEdition)))
    : editionLabel(editionCourante);
  const kpiCA = kpiVentes.reduce((s, v) => s + (parseFloat(v.montantHT) || 0), 0);
  const kpiARelancer = kpiVentes.filter((v) => v.statutBAT === "envoye" || v.statutBAT === "modification").length;
  const kpiDu = kpiVentes.filter((v) => !v.paye).reduce((s, v) => s + (parseFloat(v.montantHT) || 0), 0);

  function resetForm() { setForm(emptyForm); setEditId(null); setErreur(""); }

  function soumettre(e) {
    e.preventDefault();
    if (!form.client.trim()) return setErreur("Le nom du client est requis.");
    if (!form.montantHT || isNaN(parseFloat(form.montantHT))) return setErreur("Le montant HT doit être un nombre.");

    if (form.programmerPlusieurs && !editId) {
      if (editionsSelectionnees.length === 0) return setErreur("Indique un nombre de parutions valide.");
      const groupeId = uid();
      const { editionIdx, programmerPlusieurs, editionDepartIdx, nbParutions, ...base } = form;
      const nouvellesVentes = editionsSelectionnees.map((edition) => ({ ...base, edition, groupeId, totalParutions: editionsSelectionnees.length, id: uid() }));
      majVentes((vs) => [...vs, ...nouvellesVentes]);
      resetForm();
      setOnglet("suivi");
      return;
    }

    const record = { ...form, edition: editions[form.editionIdx] };
    if (editId) majVentes((vs) => vs.map((v) => (v.id === editId ? { ...record, id: editId } : v)));
    else majVentes((vs) => [...vs, { ...record, id: uid() }]);
    resetForm();
    setOnglet("suivi");
  }

  function modifier(v) {
    const idx = editions.findIndex((e) => editionKey(e) === editionKey(v.edition));
    setForm({ ...emptyForm, ...v, editionIdx: idx >= 0 ? idx : 0 });
    setEditId(v.id);
    setOnglet("saisie");
  }

  function supprimer(id) { majVentes((vs) => vs.filter((v) => v.id !== id)); }
  function supprimerGroupe(groupeId) { majVentes((vs) => vs.filter((v) => v.groupeId !== groupeId)); }

  function toggleEtape(id, key) {
    majVentes((vs) => vs.map((v) => {
      if (v.id !== id) return v;
      const aujourdhui = new Date().toISOString().slice(0, 10);
      return { ...v, [key]: v[key] ? "" : aujourdhui };
    }));
  }
  function changerStatutBAT(id, statutId) {
    majVentes((vs) => vs.map((v) => {
      if (v.id !== id) return v;
      const aujourdhui = new Date().toISOString().slice(0, 10);
      const nouveauStatut = v.statutBAT === statutId ? "" : statutId;
      return { ...v, statutBAT: nouveauStatut, dateStatutBAT: nouveauStatut ? aujourdhui : "" };
    }));
  }
  function togglePaye(id) { majVentes((vs) => vs.map((v) => (v.id === id ? { ...v, paye: !v.paye } : v))); }
  function toggleTexte(id) { majVentes((vs) => vs.map((v) => (v.id === id ? { ...v, texteRecu: !v.texteRecu } : v))); }
  function updateBilanExtra(key, field, value) { majBilanExtra((b) => ({ ...b, [key]: { ...b[key], [field]: value } })); }
  function ajouterSurface() { const s = nouveauSurface.trim(); if (s && !surfaces.includes(s)) majSurfaces((x) => [...x, s]); setNouveauSurface(""); }
  function ajouterPosition() { const p = nouveauPosition.trim(); if (p && !positions.includes(p)) majPositions((x) => [...x, p]); setNouveauPosition(""); }

  const bonEditingRef = useRef(false);
  const bonTimerRef = useRef(null);
  function majBon(fn) {
    bonEditingRef.current = true;
    setBonForm(f => {
      const nf = fn(f);
      sauverLocal("zemag-pub-bon", nf);
      if (bonTimerRef.current) clearTimeout(bonTimerRef.current);
      bonTimerRef.current = setTimeout(() => {
        docRef.set({ bonCommande: nf }, { merge: true }).catch(() => {});
        setTimeout(() => { bonEditingRef.current = false; }, 1000);
      }, 1500);
      return nf;
    });
  }
  function majBonLigne(idx, field, value) {
    majBon(f => ({ ...f, lignes: f.lignes.map((l, i) => i === idx ? { ...l, [field]: value } : l) }));
  }
  function majBonCal(li, mi) {
    majBon(f => ({ ...f, calendrier: f.calendrier.map((r, i) => i === li ? r.map((v, j) => j === mi ? !v : v) : r) }));
  }
  function totalBonLigne(l) {
    const prix = parseFloat(l.tarifRemise) || parseFloat(l.tarif) || 0;
    const nb = parseInt(l.nbParutions) || 0;
    return prix * nb;
  }
  function resetBon() {
    majBon(() => ({
      date: "", raisonSociale: "", adresse: "", codePostal: "", ville: "",
      email: "", tel: "", mobile: "",
      lignes: Array.from({ length: 5 }, () => ({ rubrique: "", format: "", tarif: "", nbParutions: "", tarifRemise: "" })),
      calendrier: Array.from({ length: 5 }, () => Array(11).fill(false)),
      modePaiement: "", observations: "", nomQualite: "",
      anneeBon: new Date().getFullYear(),
    }));
  }
  function imprimerBon() {
    const moisComplets = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Sept.", "Oct.", "Nov.", "Déc."];
    const dateFormatee = bonForm.date ? new Date(bonForm.date + "T00:00:00").toLocaleDateString("fr-FR") : "......./......./...............";
    const totalHT = bonForm.lignes.reduce((s, l) => s + totalBonLigne(l), 0);
    const tva = totalHT * 0.2;
    const ttc = totalHT + tva;
    const fmt = (n) => n ? n.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €" : "";

    const lignesHTML = bonForm.lignes.map((l, i) => {

      const tdc = 'style="border:1px solid #999;padding:2px 4px;font-size:8pt;text-align:center"';

    }).join("");

    const calMoisH = moisComplets.map(m => '<th style="border:1px solid #999;padding:1px 2px;font-size:7pt;text-align:center;background:#f0e6d2">' + m + '</th>').join("");

      return '<tr><td style="border:1px solid #999;padding:1px;text-align:center;font-weight:700;font-size:7pt">' + (i+1) + '</td>' + cells + '</tr>';
    }).join("");

    const modePaiementLabels = { cheque: "CHÈQUE", reception_facture: "RÉCEPTION DE FACTURE", virement: "VIREMENT", "30_jours": "30 JOURS" };

    + '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">'
    + '<div style="display:flex;align-items:center;gap:12px"><img src="' + LOGO_ZEMAG + '" style="height:45px"/>'
    + '<div><div style="font-size:28pt;font-weight:700;color:#c9a26a;line-height:1">' + bonForm.anneeBon + '</div>'
    + '<div style="margin-top:2px;font-size:8pt">Bon de commande le : <strong>' + dateFormatee + '</strong></div></div></div>'
    + '<div style="text-align:right;font-size:7pt;line-height:1.4"><div style="font-weight:700;font-size:8pt">CB MediaCom SAS</div><div>SIRET : 807 882 170 00010</div><div>91 rue Roland Garros - 36000 Châteauroux</div><div>Christine Barbat | 06 86 20 30 01 | zemag36@gmail.com</div></div></div>'
    + '<table style="width:100%;border-collapse:collapse;margin-bottom:5px"><tr><td style="border:1px solid #999;padding:2px 4px;font-weight:700;background:#f7f3ea;width:100px">RAISON SOCIALE :</td><td style="border:1px solid #999;padding:2px 4px" colspan="3">' + (bonForm.raisonSociale||'') + '</td></tr>'
    + '<tr><td style="border:1px solid #999;padding:2px 4px;font-weight:700;background:#f7f3ea">Adresse :</td><td style="border:1px solid #999;padding:2px 4px">' + (bonForm.adresse||'') + '</td><td style="border:1px solid #999;padding:2px 4px;font-weight:700;background:#f7f3ea;width:80px">Code postal :</td><td style="border:1px solid #999;padding:2px 4px;width:70px">' + (bonForm.codePostal||'') + '</td></tr>'
    + '<tr><td style="border:1px solid #999;padding:2px 4px;font-weight:700;background:#f7f3ea">Ville :</td><td style="border:1px solid #999;padding:2px 4px">' + (bonForm.ville||'') + '</td><td style="border:1px solid #999;padding:2px 4px;font-weight:700;background:#f7f3ea">Email :</td><td style="border:1px solid #999;padding:2px 4px">' + (bonForm.email||'') + '</td></tr>'
    + '<tr><td style="border:1px solid #999;padding:2px 4px;font-weight:700;background:#f7f3ea">Tel :</td><td style="border:1px solid #999;padding:2px 4px">' + (bonForm.tel||'') + '</td><td style="border:1px solid #999;padding:2px 4px;font-weight:700;background:#f7f3ea">Mobile :</td><td style="border:1px solid #999;padding:2px 4px">' + (bonForm.mobile||'') + '</td></tr></table>'
    + '<table style="width:100%;border-collapse:collapse;margin-bottom:2px"><thead><tr><th style="border:1px solid #999;padding:2px 4px;background:#f0e6d2;font-size:7pt;text-transform:uppercase;width:24px"></th><th style="border:1px solid #999;padding:2px 4px;background:#f0e6d2;font-size:7pt;text-transform:uppercase">Rubrique</th><th style="border:1px solid #999;padding:2px 4px;background:#f0e6d2;font-size:7pt;text-transform:uppercase">Format</th><th style="border:1px solid #999;padding:2px 4px;background:#f0e6d2;font-size:7pt;text-transform:uppercase">Tarif</th><th style="border:1px solid #999;padding:2px 4px;background:#f0e6d2;font-size:7pt;text-transform:uppercase;white-space:nowrap">Nb Parutions</th><th style="border:1px solid #999;padding:2px 4px;background:#f0e6d2;font-size:7pt;text-transform:uppercase;white-space:nowrap">Tarif remisé</th><th style="border:1px solid #999;padding:2px 4px;background:#f0e6d2;font-size:7pt;text-transform:uppercase">Total HT</th></tr></thead><tbody>' + lignesHTML + '</tbody></table>'
    + '<div style="font-size:6pt;color:#666;margin-bottom:5px">Format en mm : Page : 170 x 240 - 1/2 Page : 157 x 114 - 1/4 Page : 77 x 114</div>'
    + '<div style="display:flex;gap:12px;margin-bottom:5px"><div style="flex:1"><div style="font-weight:700;font-size:8pt;margin-bottom:2px">CALENDRIER DE PARUTION : ' + bonForm.anneeBon + '</div><table style="width:100%;border-collapse:collapse"><thead><tr><th style="border:1px solid #999;padding:1px;background:#f0e6d2;font-size:6pt;width:18px"></th>' + calMoisH + '</tr></thead><tbody>' + calRows + '</tbody></table></div>'
    + '<div style="width:150px;display:flex;flex-direction:column;justify-content:flex-end"><table style="border-collapse:collapse;margin-left:auto"><tr><td style="padding:2px 6px;font-size:8pt">Total HT</td><td style="padding:2px 6px;font-weight:700;text-align:right;font-size:8pt">' + fmt(totalHT) + '</td></tr><tr><td style="padding:2px 6px;font-size:8pt">TVA 20%</td><td style="padding:2px 6px;text-align:right;font-size:8pt">' + fmt(tva) + '</td></tr><tr style="border-top:2px solid #222"><td style="padding:3px 6px;font-weight:700;font-size:9pt">Total TTC</td><td style="padding:3px 6px;font-weight:700;text-align:right;font-size:10pt">' + fmt(ttc) + '</td></tr></table></div></div>'
    + '<div style="display:flex;gap:12px"><div style="flex:1;font-size:8pt"><div style="margin-bottom:4px"><strong>Date :</strong> ' + dateFormatee + '</div><div style="margin-bottom:4px"><strong>MODE DE PAIEMENT :</strong> ' + (modePaiementLabels[bonForm.modePaiement]||'') + '</div><div><strong>Observations :</strong> ' + (bonForm.observations||'') + '</div></div><div style="flex:1;text-align:center;font-size:8pt"><div style="font-size:7pt;color:#666;margin-bottom:2px">Cachet commercial du client</div><div style="border:1px dashed #ccc;height:35px;margin-bottom:5px"></div><div style="font-size:7pt;color:#666;margin-bottom:2px">Signature du client</div><div style="border:1px dashed #ccc;height:25px;margin-bottom:4px"></div><div><strong>Nom et qualité :</strong> ' + (bonForm.nomQualite||'') + '</div></div></div>'
    + '</div><script>window.onload=function(){window.print();};<\/script></body></html>';

    const w = window.open("", "_blank");
    if (w) { w.document.write(html); w.document.close(); }

  const totalBonHT = bonForm.lignes.reduce((s, l) => s + totalBonLigne(l), 0);

  return (

              style={{ padding: "10px 16px", fontSize: 14, fontWeight: 600, borderBottom: onglet === t.id ? "3px solid #c9a26a" : "3px solid transparent", color: onglet === t.id ? "#f2ede2" : "#a49b8a" }}>
              {t.label}
            </div>
          ))}
        </nav>
      </header>

      <main style={{ maxWidth: 980, margin: "0 auto", padding: "20px 20px 60px" }}>
        {onglet !== "saisie" && onglet !== "bon" && (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px,1fr))", gap: 12, marginBottom: 24 }}>
            <Kpi label={`CA ${kpiLabelEdition}`} value={euros(kpiCA)} />
            <Kpi label="À relancer (BAT)" value={kpiARelancer} accent={kpiARelancer ? "#a8412f" : null} />
            <Kpi label="Dû (non payé)" value={euros(kpiDu)} accent={kpiDu ? "#b5792f" : null} />
          </div>
        )}

        {onglet === "saisie" && (
          <div style={{ background: "#fff", border: "1px solid #e2dac7", borderRadius: 12, padding: 20 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
              <h2 style={{ margin: 0, fontSize: 17, fontFamily: "Georgia, serif" }}>{editId ? "Modifier la vente" : "Nouvelle vente"}</h2>
              {editId && <button type="button" className="btn" onClick={resetForm} style={{ background: "none", color: "#8b8478", display: "flex", alignItems: "center", gap: 4 }}>✕ Annuler</button>}
            </div>
            {erreur && <div style={{ background: "#fbe9e6", color: "#a8412f", padding: "8px 12px", borderRadius: 8, marginBottom: 14, fontSize: 13 }}>{erreur}</div>}

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
              <Champ label="Client" required><input value={form.client} onChange={(e) => setForm({ ...form, client: e.target.value })} placeholder="Nom de l'entreprise" style={inputStyle} /></Champ>
              {!form.programmerPlusieurs && (
                <Champ label="Édition">
                  <select value={form.editionIdx} onChange={(e) => setForm({ ...form, editionIdx: parseInt(e.target.value, 10) })} style={inputStyle}>
                    {editions.map((e, i) => <option key={i} value={i}>{editionLabel(e)}</option>)}

              <Champ label="Surface">
                <select value={form.surface} onChange={(e) => setForm({ ...form, surface: e.target.value })} style={inputStyle}>

              <Champ label="Position">
                <select value={form.position} onChange={(e) => setForm({ ...form, position: e.target.value })} style={inputStyle}>

              <Champ label={form.programmerPlusieurs ? "Montant HT par parution (€)" : "Montant HT (€)"} required><input type="number" step="0.01" value={form.montantHT} onChange={(e) => setForm({ ...form, montantHT: e.target.value })} style={inputStyle} /></Champ>
              <div style={{ display: "flex", alignItems: "flex-end", gap: 20, paddingBottom: 8 }}>
                <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13 }}>
                  <input type="checkbox" checked={form.texteRecu} onChange={(e) => setForm({ ...form, texteRecu: e.target.checked })} /> Texte reçu

                <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13 }}>

        {onglet === "suivi" && (

              <input value={recherche} onChange={(e) => setRecherche(e.target.value)} placeholder="Rechercher un client..." style={{ ...inputStyle, marginBottom: 10, fontSize: 15, padding: "10px 14px", background: "#fff", border: "1px solid #e2dac7", borderRadius: 10 }} />

                    <div>
                      <div style={{ fontWeight: 700, fontSize: 15 }}>{v.client}</div>
                      <div style={{ fontSize: 13, color: "#8b8478" }}>
                        {v.surface} · {v.position} · {editionLabel(v.edition)}
                        {v.groupeId && <span style={{ marginLeft: 6, fontSize: 11, background: "#f0e6d2", color: "#8a6a2f", padding: "1px 8px", borderRadius: 999, fontWeight: 700 }}>Contrat {v.totalParutions} parutions</span>}
                      </div>
                    </div>
                    <div style={{ textAlign: "right" }}>
                      <div style={{ fontWeight: 700, fontSize: 16 }}>{euros(parseFloat(v.montantHT))}</div>
                    </div>
                  </div>

                  <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
                    <span className="chip" style={{ background: v.texteRecu ? "#eaf3ec" : "#f2ede2", color: v.texteRecu ? "#3d6b4a" : "#8b8478" }} onClick={() => toggleTexte(v.id)}>
                      {v.texteRecu ? "Texte reçu" : "Texte manquant"}
                    </span>
                    <span className="chip" style={{ background: v.paye ? "#eaf3ec" : "#fbe9e6", color: v.paye ? "#3d6b4a" : "#a8412f" }} onClick={() => togglePaye(v.id)}>
                      € {v.paye ? "Payé" : "Non payé"}
                    </span>
                  </div>

                  {v.notes && <div style={{ marginTop: 10, fontSize: 12, color: "#5c5548", background: "#f7f3ea", padding: "6px 10px", borderRadius: 6 }}>{v.notes}</div>}

                  <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: ".04em", color: "#8b8478", marginTop: 12 }}>Circuit questionnaire / maquette</div>
                  <div style={{ display: "flex", gap: 10, marginTop: 6, flexWrap: "wrap" }}>
                    {BAT_ETAPES.map((e) => (
                      <button key={e.key} className="btn" onClick={() => toggleEtape(v.id, e.key)} title={v[e.key] ? `Fait le ${v[e.key]}` : "Pas encore fait"}
                        style={{ background: "none", padding: 0, display: "flex", flexDirection: "column", alignItems: "center", gap: 3, width: 68 }}>
                        <span style={{ background: v[e.key] ? "#3d6b4a" : "#f2ede2", color: v[e.key] ? "#fff" : "#8b8478", width: 30, height: 30, borderRadius: 999, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13 }}>
                          {e.icon}
                        </span>
                        <span style={{ fontSize: 10, color: "#8b8478", textAlign: "center", lineHeight: 1.2 }}>{e.label}</span>
                      </button>
                    ))}
                  </div>

                  <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: ".04em", color: "#8b8478", marginTop: 12 }}>Statut du BAT</div>
                  <div style={{ display: "flex", gap: 6, marginTop: 6, flexWrap: "wrap" }}>
                    {BAT_STATUTS.map((s) => (
                      <button key={s.id} className="btn" onClick={() => changerStatutBAT(v.id, s.id)}
                        style={{ background: v.statutBAT === s.id ? s.color : "#f2ede2", color: v.statutBAT === s.id ? "#fff" : "#8b8478", padding: "5px 12px", borderRadius: 999, display: "flex", alignItems: "center", gap: 5, fontSize: 12, fontWeight: 700 }}>
                        {s.icon} {s.label}
                      </button>
                    ))}
                  </div>

                  <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: ".04em", color: "#8b8478", marginTop: 12 }}>Statut publireportage</div>
                  <select value={v.statutPublireportage || ""} onChange={(e) => majVentes((vs) => vs.map((x) => (x.id === v.id ? { ...x, statutPublireportage: e.target.value } : x)))}
                    style={{ ...inputStyle, marginTop: 6, width: "auto" }}>
                    <option value="">Non concerné</option>
                    {STATUTS_PUBLIREPORTAGE.map((s) => <option key={s.id} value={s.id}>{s.label}</option>)}
                  </select>

                  <div style={{ display: "flex", gap: 12, marginTop: 10, flexWrap: "wrap" }}>
                    <button className="btn" onClick={() => modifier(v)} style={{ background: "none", color: "#b5792f", display: "flex", alignItems: "center", gap: 4, fontSize: 13 }}>✎ Modifier</button>
                    <button className="btn" onClick={() => supprimer(v.id)} style={{ background: "none", color: "#a8412f", display: "flex", alignItems: "center", gap: 4, fontSize: 13 }}>🗑 Supprimer</button>
                    {v.groupeId && (
                      <button className="btn" onClick={() => supprimerGroupe(v.groupeId)} style={{ background: "none", color: "#a8412f", display: "flex", alignItems: "center", gap: 4, fontSize: 13, textDecoration: "underline" }}>
                        🗑 Supprimer tout le contrat ({v.totalParutions} parutions)
                      </button>
                    )}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {onglet === "bilan" && (
          <div style={{ background: "#fff", border: "1px solid #e2dac7", borderRadius: 12, padding: 16, overflowX: "auto" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
              <label style={{ fontSize: 13, color: "#8b8478" }}>Année :</label>
              <select value={filtreAnnee} onChange={(e) => setFiltreAnnee(parseInt(e.target.value, 10))} style={{ ...inputStyle, width: "auto" }}>
                {anneesDisponibles.map((a) => <option key={a} value={a}>{a}</option>)}
              </select>
            </div>
            <table>
              <thead>
                <tr><th>N°</th><th>Mois</th><th>Année</th><th>CA HT</th><th>Encaissé</th><th>Dû</th><th>Imprimerie</th><th>Infographie</th><th>Nbre pages</th></tr>
              </thead>
              <tbody>
                {editions.filter((e) => e.annee === filtreAnnee).map((e) => {
                  const k = editionKey(e);
                  const liste = parEdition[k] || [];
                  const caHT = liste.reduce((s, v) => s + (parseFloat(v.montantHT) || 0), 0);
                  const encaisse = liste.filter((v) => v.paye).reduce((s, v) => s + (parseFloat(v.montantHT) || 0), 0);
                  const du = caHT - encaisse;
                  const extra = bilanExtra[k] || {};
                  return (
                    <tr key={k}>
                      <td>{e.numero}</td>
                      <td>{e.mois}</td>
                      <td>{e.annee}</td>
                      <td>{euros(caHT)}</td>
                      <td>{euros(encaisse)}</td>
                      <td style={{ color: du > 0 ? "#a8412f" : "inherit" }}>{euros(du)}</td>
                      <td><input type="number" value={extra.imprimerie || ""} onChange={(ev) => updateBilanExtra(k, "imprimerie", ev.target.value)} style={{ ...inputStyle, width: 90, padding: "4px 6px" }} placeholder="€" /></td>
                      <td><input type="number" value={extra.infographie || ""} onChange={(ev) => updateBilanExtra(k, "infographie", ev.target.value)} style={{ ...inputStyle, width: 90, padding: "4px 6px" }} placeholder="€" /></td>
                      <td><input type="number" value={extra.nbrePages || ""} onChange={(ev) => updateBilanExtra(k, "nbrePages", ev.target.value)} style={{ ...inputStyle, width: 70, padding: "4px 6px" }} /></td>
                    </tr>
                  );
                })}
              </tbody>
              <tfoot>
                <tr style={{ fontWeight: 700 }}>
                  <td colSpan={3}>TOTAL {filtreAnnee}</td>
                  <td>{euros(ventesAnnee.reduce((s, v) => s + (parseFloat(v.montantHT) || 0), 0))}</td>
                  <td>{euros(ventesAnnee.filter((v) => v.paye).reduce((s, v) => s + (parseFloat(v.montantHT) || 0), 0))}</td>
                  <td>{euros(ventesAnnee.filter((v) => !v.paye).reduce((s, v) => s + (parseFloat(v.montantHT) || 0), 0))}</td>
                  <td>{euros(editions.filter((e) => e.annee === filtreAnnee).reduce((s, e) => s + (parseFloat((bilanExtra[editionKey(e)] || {}).imprimerie) || 0), 0))}</td>
                  <td>{euros(editions.filter((e) => e.annee === filtreAnnee).reduce((s, e) => s + (parseFloat((bilanExtra[editionKey(e)] || {}).infographie) || 0), 0))}</td>
                  <td>{editions.filter((e) => e.annee === filtreAnnee).reduce((s, e) => s + (parseFloat((bilanExtra[editionKey(e)] || {}).nbrePages) || 0), 0)}</td>
                </tr>
              </tfoot>
            </table>
          </div>
        )}

        {onglet === "bon" && (
          <div style={{ background: "#fff", border: "1px solid #e2dac7", borderRadius: 12, padding: 20 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
              <h2 style={{ margin: 0, fontSize: 17, fontFamily: "Georgia, serif" }}>Bon de commande</h2>
              <button type="button" className="btn" onClick={resetBon} style={{ background: "none", color: "#8b8478", fontSize: 13 }}>Nouveau bon</button>
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
              <Champ label="Année du bon">
                <select value={bonForm.anneeBon} onChange={(e) => majBon(f => ({ ...f, anneeBon: parseInt(e.target.value, 10) }))} style={inputStyle}>
                  {[2025, 2026, 2027, 2028, 2029, 2030].map(a => <option key={a} value={a}>{a}</option>)}
                </select>
              </Champ>
              <Champ label="Date du bon">
                <input type="date" value={bonForm.date} onChange={(e) => majBon(f => ({ ...f, date: e.target.value }))} style={inputStyle} />
              </Champ>
            </div>

            <div style={{ marginTop: 16, paddingTop: 14, borderTop: "1px dashed #e2dac7" }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: "#5c5548", marginBottom: 8 }}>INFORMATIONS CLIENT</div>
              <Champ label="Raison sociale" required>
                <input value={bonForm.raisonSociale} onChange={(e) => majBon(f => ({ ...f, raisonSociale: e.target.value }))} style={inputStyle} />
              </Champ>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                <Champ label="Adresse">
                  <input value={bonForm.adresse} onChange={(e) => majBon(f => ({ ...f, adresse: e.target.value }))} style={inputStyle} />
                </Champ>
                <Champ label="Code postal">
                  <input value={bonForm.codePostal} onChange={(e) => majBon(f => ({ ...f, codePostal: e.target.value }))} style={inputStyle} />
                </Champ>
                <Champ label="Ville">
                  <input value={bonForm.ville} onChange={(e) => majBon(f => ({ ...f, ville: e.target.value }))} style={inputStyle} />
                </Champ>
                <Champ label="Email">
                  <input type="email" value={bonForm.email} onChange={(e) => majBon(f => ({ ...f, email: e.target.value }))} style={inputStyle} />
                </Champ>
                <Champ label="Téléphone">
                  <input value={bonForm.tel} onChange={(e) => majBon(f => ({ ...f, tel: e.target.value }))} style={inputStyle} />
                </Champ>
                <Champ label="Mobile">
                  <input value={bonForm.mobile} onChange={(e) => majBon(f => ({ ...f, mobile: e.target.value }))} style={inputStyle} />
                </Champ>
              </div>
            </div>

            <div style={{ marginTop: 16, paddingTop: 14, borderTop: "1px dashed #e2dac7" }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: "#5c5548", marginBottom: 8 }}>LIGNES DE COMMANDE</div>
              <div style={{ overflowX: "auto" }}>
                <table>
                  <thead>
                    <tr>
                      <th style={{ width: 30 }}></th>
                      <th>Rubrique</th>
                      <th>Format</th>
                      <th>Tarif (€)</th>
                      <th>Nb parutions</th>
                      <th>Tarif remisé (€)</th>
                      <th>Total HT</th>
                    </tr>
                  </thead>
                  <tbody>
                    {bonForm.lignes.map((l, i) => {
                      const tot = totalBonLigne(l);
                      return (
                        <tr key={i}>
                          <td style={{ fontWeight: 700, textAlign: "center" }}>{i + 1}</td>
                          <td><input value={l.rubrique} onChange={(e) => majBonLigne(i, "rubrique", e.target.value)} style={{ ...inputStyle, padding: "4px 6px" }} /></td>
                          <td><input value={l.format} onChange={(e) => majBonLigne(i, "format", e.target.value)} style={{ ...inputStyle, padding: "4px 6px" }} /></td>
                          <td><input type="number" value={l.tarif} onChange={(e) => majBonLigne(i, "tarif", e.target.value)} style={{ ...inputStyle, padding: "4px 6px", width: 90 }} /></td>
                          <td><input type="number" value={l.nbParutions} onChange={(e) => majBonLigne(i, "nbParutions", e.target.value)} style={{ ...inputStyle, padding: "4px 6px", width: 70 }} /></td>
                          <td><input type="number" value={l.tarifRemise} onChange={(e) => majBonLigne(i, "tarifRemise", e.target.value)} style={{ ...inputStyle, padding: "4px 6px", width: 90 }} /></td>
                          <td style={{ fontWeight: 700, textAlign: "right", whiteSpace: "nowrap" }}>{tot ? euros(tot) : ""}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              <div style={{ fontSize: 11, color: "#8b8478", marginTop: 4 }}>Format en mm : Page : 170 x 240 - 1/2 Page : 157 x 114 - 1/4 Page : 77 x 114</div>
            </div>

            <div style={{ marginTop: 16, paddingTop: 14, borderTop: "1px dashed #e2dac7" }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: "#5c5548", marginBottom: 8 }}>CALENDRIER DE PARUTION {bonForm.anneeBon}</div>
              <div style={{ overflowX: "auto" }}>
                <table>
                  <thead>
                    <tr>
                      <th style={{ width: 30 }}></th>
                      {MOIS_BON.map(m => <th key={m} style={{ fontSize: 10, padding: "4px 2px", textAlign: "center" }}>{m}</th>)}
                    </tr>
                  </thead>
                  <tbody>
                    {[0,1,2,3,4].map(i => (
                      <tr key={i}>
                        <td style={{ fontWeight: 700, textAlign: "center" }}>{i + 1}</td>
                        {MOIS_BON.map((m, j) => (
                          <td key={j} style={{ textAlign: "center", padding: 4 }}>
                            <input type="checkbox" checked={(bonForm.calendrier[i] || [])[j] || false} onChange={() => majBonCal(i, j)} />
                          </td>
                        ))}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            <div style={{ marginTop: 14, display: "flex", justifyContent: "flex-end" }}>
              <div style={{ background: "#f7f3ea", padding: 14, borderRadius: 8, minWidth: 220 }}>
                <div style={{ display: "flex", justifyContent: "space-between", gap: 20, fontSize: 13, marginBottom: 4 }}>
                  <span>Total HT :</span><strong>{euros(totalBonHT)}</strong>
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", gap: 20, fontSize: 13, marginBottom: 4 }}>
                  <span>TVA 20% :</span><span>{euros(totalBonHT * 0.2)}</span>
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", gap: 20, fontSize: 16, fontWeight: 700, borderTop: "2px solid #2c2a24", paddingTop: 6 }}>
                  <span>Total TTC :</span><span>{euros(totalBonHT * 1.2)}</span>
                </div>
              </div>
            </div>

            <div style={{ marginTop: 16, paddingTop: 14, borderTop: "1px dashed #e2dac7" }}>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                <Champ label="Mode de paiement">
                  <select value={bonForm.modePaiement} onChange={(e) => majBon(f => ({ ...f, modePaiement: e.target.value }))} style={inputStyle}>
                    <option value="">—</option>
                    <option value="cheque">Chèque</option>
                    <option value="reception_facture">Réception de facture</option>
                    <option value="virement">Virement</option>
                    <option value="30_jours">30 jours</option>
                  </select>
                </Champ>
                <Champ label="Nom et qualité du signataire">
                  <input value={bonForm.nomQualite} onChange={(e) => majBon(f => ({ ...f, nomQualite: e.target.value }))} style={inputStyle} />
                </Champ>
              </div>
              <Champ label="Observations">
                <textarea value={bonForm.observations} onChange={(e) => majBon(f => ({ ...f, observations: e.target.value }))} rows={2} style={{ ...inputStyle, resize: "vertical" }} />
              </Champ>
            </div>

            <button type="button" className="btn" onClick={imprimerBon} style={{ marginTop: 18, background: "#b5792f", color: "#fff", padding: "10px 20px", borderRadius: 8, fontSize: 14 }}>
              Imprimer / Envoyer en PDF
            </button>
          </div>
        )}
      </main>
    </div>
  );
}

window.lancerApp = function() {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App />);
};
</script>
</body>
</html>
