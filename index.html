const db = firebase.firestore();
const auth = firebase.auth();
const provider = new firebase.auth.GoogleAuthProvider();
auth.setPersistence(firebase.auth.Auth.Persistence.NONE);

async function connexionGoogle() {
  try {
    document.getElementById("login-err").textContent = "";
    const result = await auth.signInWithPopup(provider);
    if (result.user.email === "zemag36@gmail.com") {
      deverrouiller();
    } else {
      document.getElementById("login-err").textContent = "Ce compte n'est pas autorisé.";
      await auth.signOut();
    }
  } catch (e) {
    if (e.code !== "auth/popup-closed-by-user") {
      document.getElementById("login-err").textContent = "Erreur de connexion. Réessayez.";
    }
  }
}

function deverrouiller() {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("root").style.display = "block";
  if (window.lancerApp) window.lancerApp();
}

      numero++;
    }
  }
  return liste;
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function euros(n) { return new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(n || 0); }
function editionLabel(e) { return e ? `${e.numero} - ${e.mois} ${e.annee}` : "Édition non précisée"; }
function editionKey(e) { return `${e.mois}|${e.annee}`; }

function chargerLocal(cle, defaut) {
  try {
    const brut = localStorage.getItem(cle);
    return brut ? JSON.parse(brut) : defaut;
  } catch (e) { return defaut; }
}
function sauverLocal(cle, valeur) {
  try { localStorage.setItem(cle, JSON.stringify(valeur)); } catch (e) {}
}

const emptyForm = {
  client: "", surface: SURFACES_DEFAUT[0], position: POSITIONS_DEFAUT[0], montantHT: "",
  texteRecu: false, paye: false, editionIdx: 0,
  programmerPlusieurs: false, editionDepartIdx: 0, nbParutions: "",
  dateEnvoiQuestionnaire: "", retourClient: "", dateEnvoiMaquette: "",
  statutBAT: "", dateStatutBAT: "", statutPublireportage: "", notes: "",
};

const inputStyle = { width: "100%", padding: "8px 10px", border: "1px solid #d9d0bc", borderRadius: 8, fontSize: 14, background: "#fdfbf6" };

function Champ({ label, required, children }) {
  return (
    <label style={{ display: "block", fontSize: 12, color: "#5c5548", marginBottom: 2, marginTop: 8 }}>
      {label}{required && <span style={{ color: "#a8412f" }}> *</span>}
      <div style={{ marginTop: 4 }}>{children}</div>
    </label>
  );
}

function Kpi({ label, value, accent }) {
  return (
    <div style={{ background: "#fff", border: "1px solid #e2dac7", borderRadius: 10, padding: 14 }}>
      <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.06em", color: "#8b8478" }}>{label}</div>
      <div style={{ fontSize: 22, fontWeight: 700, marginTop: 4, color: accent || "#2c2a24" }}>{value}</div>
    </div>
  );
}

function App() {
  const [ventes, setVentes] = useState(() => chargerLocal("zemag-pub-ventes", []));
  const [editions] = useState(EDITIONS_DEFAUT);
  const [bilanExtra, setBilanExtra] = useState(() => chargerLocal("zemag-pub-bilan", {}));
  const [surfaces, setSurfaces] = useState(() => chargerLocal("zemag-pub-surfaces", SURFACES_DEFAUT));
  const [positions, setPositions] = useState(() => chargerLocal("zemag-pub-positions", POSITIONS_DEFAUT));
  const [onglet, setOnglet] = useState("saisie");
  const [form, setForm] = useState(emptyForm);
  const [editId, setEditId] = useState(null);
  const [filtreEdition, setFiltreEdition] = useState("tous");
  const [filtreAnnee, setFiltreAnnee] = useState(new Date().getFullYear());
  const [nouveauSurface, setNouveauSurface] = useState("");
  const [nouveauPosition, setNouveauPosition] = useState("");
  const [erreur, setErreur] = useState("");
  const [recherche, setRecherche] = useState("");
  const [filtreBAT, setFiltreBAT] = useState("tous");
  const [bonForm, setBonForm] = useState(() => chargerLocal("zemag-pub-bon", {
    date: "", raisonSociale: "", adresse: "", codePostal: "", ville: "",
    email: "", tel: "", mobile: "",
    lignes: Array.from({ length: 5 }, () => ({ rubrique: "", format: "", tarif: "", nbParutions: "", tarifRemise: "" })),
    calendrier: Array.from({ length: 5 }, () => Array(11).fill(false)),
    modePaiement: "", observations: "", nomQualite: "",
    anneeBon: new Date().getFullYear(),
  }));
  const [historiqueBC, setHistoriqueBC] = useState(() => chargerLocal("zemag-pub-historique-bc", []));
  const [filtreAnneeBC, setFiltreAnneeBC] = useState(new Date().getFullYear());

  const docRef = db.collection("zemag").doc("data");

  function majVentes(fn) { setVentes((vs) => { const nv = fn(vs); sauverLocal("zemag-pub-ventes", nv); docRef.set({ ventes: nv }, { merge: true }).catch(() => {}); return nv; }); }
  function majBilanExtra(fn) { setBilanExtra((b) => { const nb = fn(b); sauverLocal("zemag-pub-bilan", nb); docRef.set({ bilanExtra: nb }, { merge: true }).catch(() => {}); return nb; }); }
  function majSurfaces(fn) { setSurfaces((s) => { const ns = fn(s); sauverLocal("zemag-pub-surfaces", ns); docRef.set({ surfaces: ns }, { merge: true }).catch(() => {}); return ns; }); }
  function majPositions(fn) { setPositions((p) => { const np = fn(p); sauverLocal("zemag-pub-positions", np); docRef.set({ positions: np }, { merge: true }).catch(() => {}); return np; }); }
  function majHistoriqueBC(fn) { setHistoriqueBC((h) => { const nh = fn(h); sauverLocal("zemag-pub-historique-bc", nh); docRef.set({ historiqueBC: nh }, { merge: true }).catch(() => {}); return nh; }); }

  useEffect(() => {
    docRef.get().then((doc) => {
      if (!doc.exists) {
        docRef.set({ ventes, bilanExtra, surfaces, positions, bonCommande: bonForm, historiqueBC }).catch(() => {});
      }
    }).catch(() => {});

    const unsub = docRef.onSnapshot((doc) => {
      if (!doc.exists || doc.metadata.hasPendingWrites) return;
      const d = doc.data();
      if (d.ventes !== undefined) { setVentes(d.ventes); sauverLocal("zemag-pub-ventes", d.ventes); }
      if (d.bilanExtra !== undefined) { setBilanExtra(d.bilanExtra); sauverLocal("zemag-pub-bilan", d.bilanExtra); }
      if (d.surfaces !== undefined) { setSurfaces(d.surfaces); sauverLocal("zemag-pub-surfaces", d.surfaces); }
      if (d.positions !== undefined) { setPositions(d.positions); sauverLocal("zemag-pub-positions", d.positions); }
      if (d.bonCommande !== undefined && !bonEditingRef.current) { setBonForm(d.bonCommande); sauverLocal("zemag-pub-bon", d.bonCommande); }

  const parEdition = useMemo(() => {
    const map = {};

  const moisLabelCourant = MOIS_LABELS[new Date().getMonth()];
  const anneeCourante = new Date().getFullYear();
  const editionCourante = editions.find((e) => e.mois === moisLabelCourant && e.annee === anneeCourante) || editions[0];
  const venteMoisCourant = parEdition[editionKey(editionCourante)] || [];

  const anneesDisponibles = useMemo(() => [...new Set(editions.map((e) => e.annee))], [editions]);
  const ventesAnnee = useMemo(() => ventes.filter((v) => v.edition && v.edition.annee === filtreAnnee), [ventes, filtreAnnee]);

  const editionsSelectionnees = useMemo(() => {
    if (!form.programmerPlusieurs) return [];

  const venteAffichees = useMemo(() => {
    let liste = filtreEdition === "tous" ? ventes : (parEdition[filtreEdition] || []);

      liste = liste.filter((v) => v.client.toLowerCase().includes(q));

    if (filtreBAT === "non_envoye") liste = liste.filter((v) => !v.statutBAT);
    else if (filtreBAT !== "tous") liste = liste.filter((v) => v.statutBAT === filtreBAT);
    return [...liste].sort((a, b) => {
      const ia = editions.findIndex((e) => editionKey(e) === editionKey(a.edition));
      const ib = editions.findIndex((e) => editionKey(e) === editionKey(b.edition));
      if (ia !== ib) return ib - ia;
      return a.client.localeCompare(b.client);

  }, [ventes, parEdition, filtreEdition, recherche, filtreBAT, editions]);

  const caFiltre = useMemo(() => venteAffichees.reduce((s, v) => s + (parseFloat(v.montantHT) || 0), 0), [venteAffichees]);

  const kpiCA = kpiVentes.reduce((s, v) => s + (parseFloat(v.montantHT) || 0), 0);

  const kpiDu = kpiVentes.filter((v) => !v.paye).reduce((s, v) => s + (parseFloat(v.montantHT) || 0), 0);

  function resetForm() { setForm(emptyForm); setEditId(null); setErreur(""); }

  function soumettre(e) {
    e.preventDefault();
    if (!form.client.trim()) return setErreur("Le nom du client est requis.");

  function modifier(v) {

  function supprimer(id) { majVentes((vs) => vs.filter((v) => v.id !== id)); }
  function supprimerGroupe(groupeId) { majVentes((vs) => vs.filter((v) => v.groupeId !== groupeId)); }

  function toggleEtape(id, key) {

  function togglePaye(id) { majVentes((vs) => vs.map((v) => (v.id === id ? { ...v, paye: !v.paye } : v))); }

  function updateBilanExtra(key, field, value) { majBilanExtra((b) => ({ ...b, [key]: { ...b[key], [field]: value } })); }
  function ajouterSurface() { const s = nouveauSurface.trim(); if (s && !surfaces.includes(s)) majSurfaces((x) => [...x, s]); setNouveauSurface(""); }
  function ajouterPosition() { const p = nouveauPosition.trim(); if (p && !positions.includes(p)) majPositions((x) => [...x, p]); setNouveauPosition(""); }

  const bonEditingRef = useRef(false);

  function majBon(fn) {
    bonEditingRef.current = true;

      const nf = fn(f);
      sauverLocal("zemag-pub-bon", nf);
      if (bonTimerRef.current) clearTimeout(bonTimerRef.current);
      bonTimerRef.current = setTimeout(() => {
        docRef.set({ bonCommande: nf }, { merge: true }).catch(() => {});

  function majBonLigne(idx, field, value) {
    majBon(f => ({ ...f, lignes: f.lignes.map((l, i) => i === idx ? { ...l, [field]: value } : l) }));
  }
  function majBonCal(li, mi) {
    majBon(f => ({ ...f, calendrier: f.calendrier.map((r, i) => i === li ? r.map((v, j) => j === mi ? !v : v) : r) }));

    + '<tr><td style="border:1px solid #999;padding:2px 4px;font-weight:700;background:#f7f3ea">Tel :</td><td style="border:1px solid #999;padding:2px 4px">' + (bonForm.tel||'') + '</td><td style="border:1px solid #999;padding:2px 4px;font-weight:700;background:#f7f3ea">Mobile :</td><td style="border:1px solid #999;padding:2px 4px">' + (bonForm.mobile||'') + '</td></tr></table>'
    + '<table style="width:100%;border-collapse:collapse;margin-bottom:2px"><thead><tr><th style="border:1px solid #999;padding:2px 4px;background:#f0e6d2;font-size:7pt;text-transform:uppercase;width:24px"></th><th style="border:1px solid #999;padding:2px 4px;background:#f0e6d2;font-size:7pt;text-transform:uppercase">Rubrique</th><th style="border:1px solid #999;padding:2px 4px;background:#f0e6d2;font-size:7pt;text-transform:uppercase">Format</th><th style="border:1px solid #999;padding:2px 4px;background:#f0e6d2;font-size:7pt;text-transform:uppercase">Tarif</th><th style="border:1px solid #999;padding:2px 4px;background:#f0e6d2;font-size:7pt;text-transform:uppercase;white-space:nowrap">Nb Parutions</th><th style="border:1px solid #999;padding:2px 4px;background:#f0e6d2;font-size:7pt;text-transform:uppercase;white-space:nowrap">Tarif remisé</th><th style="border:1px solid #999;padding:2px 4px;background:#f0e6d2;font-size:7pt;text-transform:uppercase">Total HT</th></tr></thead><tbody>' + lignesHTML + '</tbody></table>'
    + '<div style="font-size:6pt;color:#666;margin-bottom:5px">Format en mm : Page : 170 x 240 - 1/2 Page : 157 x 114 - 1/4 Page : 77 x 114</div>'
    + '<div style="display:flex;gap:12px;margin-bottom:5px"><div style="flex:1"><div style="font-weight:700;font-size:8pt;margin-bottom:2px">CALENDRIER DE PARUTION : ' + bonForm.anneeBon + '</div><table style="width:100%;border-collapse:collapse"><thead><tr><th style="border:1px solid #999;padding:1px;background:#f0e6d2;font-size:6pt;width:18px"></th>' + calMoisH + '</tr></thead><tbody>' + calRows + '</tbody></table></div>'
    + '<div style="width:150px;display:flex;flex-direction:column;justify-content:flex-end"><table style="border-collapse:collapse;margin-left:auto"><tr><td style="padding:2px 6px;font-size:8pt">Total HT</td><td style="padding:2px 6px;font-weight:700;text-align:right;font-size:8pt">' + fmt(totalHT) + '</td></tr><tr><td style="padding:2px 6px;font-size:8pt">TVA 20%</td><td style="padding:2px 6px;text-align:right;font-size:8pt">' + fmt(tva) + '</td></tr><tr style="border-top:2px solid #222"><td style="padding:3px 6px;font-weight:700;font-size:9pt">Total TTC</td><td style="padding:3px 6px;font-weight:700;text-align:right;font-size:10pt">' + fmt(ttc) + '</td></tr></table></div></div>'
    + '<div style="display:flex;gap:12px"><div style="flex:1;font-size:8pt"><div style="margin-bottom:4px"><strong>Date :</strong> ' + dateFormatee + '</div><div style="margin-bottom:4px"><strong>MODE DE PAIEMENT :</strong> ' + (modePaiementLabels[bonForm.modePaiement]||'') + '</div><div><strong>Observations :</strong> ' + (bonForm.observations||'') + '</div></div><div style="flex:1;text-align:center;font-size:8pt"><div style="font-size:7pt;color:#666;margin-bottom:2px">Cachet commercial du client</div><div style="border:1px dashed #ccc;height:35px;margin-bottom:5px"></div><div style="font-size:7pt;color:#666;margin-bottom:2px">Signature du client</div><div style="border:1px dashed #ccc;height:25px;margin-bottom:4px"></div><div><strong>Nom et qualité :</strong> ' + (bonForm.nomQualite||'') + '</div></div></div>'
    + '</div></body></html>';

    const iframe = document.createElement('iframe');

  const totalBonHT = bonForm.lignes.reduce((s, l) => s + totalBonLigne(l), 0);

              style={{ padding: "10px 16px", fontSize: 14, fontWeight: 600, borderBottom: onglet === t.id ? "3px solid #c9a26a" : "3px solid transparent", color: onglet === t.id ? "#f2ede2" : "#a49b8a" }}>

            </div>

            {historiqueBC.filter(b => (b.anneeBon || new Date(b.dateArchive).getFullYear()) === filtreAnneeBC).length === 0 ? (
              <div style={{ color: "#8b8478", fontSize: 14, padding: 20, textAlign: "center" }}>Aucun bon de commande archivé pour {filtreAnneeBC}</div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {historiqueBC
                  .filter(b => (b.anneeBon || new Date(b.dateArchive).getFullYear()) === filtreAnneeBC)
                  .sort((a, b) => new Date(b.dateArchive) - new Date(a.dateArchive))
                  .map(b => {
                    const totalHT = (b.lignes || []).reduce((s, l) => s + (((parseFloat(l.tarifRemise) || parseFloat(l.tarif) || 0)) * (parseInt(l.nbParutions) || 0)), 0);
                    const dateArc = b.dateArchive ? new Date(b.dateArchive).toLocaleDateString("fr-FR") : "";
                    const dateBon = b.date ? new Date(b.date + "T00:00:00").toLocaleDateString("fr-FR") : "";
                    return (
                      <div key={b.id} style={{ border: "1px solid #e2dac7", borderRadius: 8, padding: 12, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                        <div>
                          <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 2 }}>{b.raisonSociale || "Sans nom"}</div>
                          <div style={{ fontSize: 12, color: "#8b8478" }}>
                            Bon du {dateBon || "?"} — Archivé le {dateArc}
                            {totalHT > 0 && <span style={{ marginLeft: 8, color: "#3d6b4a", fontWeight: 600 }}>{euros(totalHT)} HT</span>}
                          </div>
                          <div style={{ fontSize: 11, color: "#a49b8a", marginTop: 2 }}>
                            {(b.lignes || []).filter(l => l.rubrique).map(l => l.rubrique).join(", ")}
                          </div>
                        </div>
                        <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                          <button className="btn" onClick={() => chargerArchive(b)} style={{ background: "#f7f3ea", border: "1px solid #e2dac7", padding: "6px 12px", borderRadius: 6, fontSize: 12, cursor: "pointer" }} title="Charger dans le bon de commande">
                            Charger
                          </button>
                          <button className="btn" onClick={() => supprimerArchive(b.id)} style={{ background: "#fff", border: "1px solid #e2dac7", padding: "6px 12px", borderRadius: 6, fontSize: 12, cursor: "pointer", color: "#a8412f" }} title="Supprimer de l'historique">
                            Supprimer
                          </button>
                        </div>
                      </div>
                    );
                  })}
              </div>
            )}
          </div>
        )}
      </main>
    </div>
  );
}

window.lancerApp = function() {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App />);
};
</script>
</body>
</html>
